version: '3.9'

networks:
  cgv-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: cgv-postgres
    restart: always
    networks:
      - cgv-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cgv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/cgv
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgrespassword
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
#      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/demo/certs/localhost.crt
#      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/demo/certs/localhost.key
      # Tắt bắt buộc HTTPS → cho phép truy cập HTTP trên môi trường dev/local
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
#      # Tắt strict hostname check → truy cập được qua localhost, 127.0.0.1
      KC_HOSTNAME_STRICT: false
      KC_PROXY: none
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1023925941045-c3c0da69qc828785k6se9djnsgg1t7dh.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-4653700278248738}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-38484a046eb77916fa63d616defd230a}
    ports:
      - "8180:8080"
#      - "8443:8443"   # Mở thêm cổng 8443 để chạy HTTPS
    # --import-realm: tự động đọc file *.json trong /opt/keycloak/data/import/
    # tạo realm nếu chưa tồn tại, idempotent khi restart
    command: start-dev --import-realm
    volumes:
      - ./keycloak/cgv-realm-export.json:/opt/keycloak/data/import/cgv-realm-export.json
      - ./certs:/opt/keycloak/demo/certs
      - ./themes:/opt/keycloak/themes
    depends_on:
      - postgres
    networks:
      - cgv-net
    restart: unless-stopped

  kong:
    image: kong:3.4
    container_name: cgv-kong
    restart: always
    user: "0:0" # Chạy container dưới quyền root để Nginx có đủ quyền đọc ghi log và config
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong-dev.yml"
      # Thay /stderr và /dev/stdout thành đường dẫn file trong thư mục của kong hoặc bỏ qua log lỗi nghiêm ngặt nếu chạy dev
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_ADMIN_ACCESS_LOG: "off"
      KONG_PROXY_ERROR_LOG: "/usr/local/kong/logs/proxy_error.log"
      KONG_ADMIN_ERROR_LOG: "/usr/local/kong/logs/admin_error.log"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./apigateway/kong-dev.yml:/usr/local/kong/declarative/kong-dev.yml
    networks:
      - cgv-net
    depends_on:
      - keycloak

  redis:
    image: redis:7-alpine
    container_name: cgv-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cgv-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-1:
    image: apache/kafka:latest
    container_name: cgv-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://cgv-kafka-1:19092,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@cgv-kafka-1:9093,2@cgv-kafka-2:9093,3@cgv-kafka-3:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_KRAFT_CLUSTER_ID: "AbCdEfGhIjKlMnOpQrStUv"
      # --- Replication & Durability ---
      # offsets.topic.replication.factor=3: topic lưu offset của consumer group phải có 3 replica
      # → nếu 1 broker chết, consumer vẫn biết mình đang đọc đến đâu
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      # transaction.state.log.replication.factor=3: topic quản lý Kafka transaction phải có 3 replica
      # → đảm bảo transactional producer không mất trạng thái khi broker chết
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      # transaction.state.log.min.isr=2: transaction chỉ được commit khi ≥2 ISR xác nhận
      # → tránh "split-brain" — 2 broker đồng ý là đủ quorum với cluster 3 node
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      # group.initial.rebalance.delay.ms=3000: chờ 3s trước khi rebalance consumer group khi khởi động
      # → tránh rebalance liên tục khi nhiều consumer cùng start lúc deploy
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      # --- Topic Defaults (áp dụng khi tạo topic không chỉ định tường minh) ---
      # num.partitions=3: mỗi topic mặc định 3 partition = 3 broker → data phân tán đều
      # consumer group có thể scale tối đa 3 consumer chạy song song
      KAFKA_NUM_PARTITIONS: 3
      # default.replication.factor=3: mỗi partition có 3 bản sao trên 3 broker khác nhau
      # → chịu được 1 broker chết mà không mất data
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      # min.insync.replicas=2: producer acks=all chỉ thành công khi ≥2 replica đã ghi xong
      # → đảm bảo data không bị mất dù 1 broker crash ngay sau khi ghi
      KAFKA_MIN_INSYNC_REPLICAS: 2
      # --- Log Retention ---
      # log.retention.hours=168: giữ message 7 ngày → có thể replay event khi service bị down
      KAFKA_LOG_RETENTION_HOURS: 168
      # log.segment.bytes=1073741824: mỗi segment file tối đa 1GB → Kafka rotate file đều đặn
      # → tránh 1 file quá to, giúp xóa data cũ nhanh hơn
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      # log.retention.check.interval.ms=300000: kiểm tra và xóa segment hết hạn mỗi 5 phút
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      # --- Message Size ---
      # message.max.bytes=10485760: cho phép message tối đa 10MB
      # → đủ cho payload JSON phức tạp (booking, payment), tránh bị reject
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      # --- Network Buffers ---
      # socket.send.buffer.bytes=102400: buffer gửi TCP = 100KB
      # socket.receive.buffer.bytes=102400: buffer nhận TCP = 100KB
      # → tăng throughput network giữa broker ↔ producer/consumer
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      # socket.request.max.bytes=104857600: request tối đa từ client = 100MB
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    networks:
      - cgv-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-2:
    image: apache/kafka:latest
    container_name: cgv-kafka-2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:19092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://cgv-kafka-2:19092,EXTERNAL://localhost:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@cgv-kafka-1:9093,2@cgv-kafka-2:9093,3@cgv-kafka-3:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_KRAFT_CLUSTER_ID: "AbCdEfGhIjKlMnOpQrStUv"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    networks:
      - cgv-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-3:
    image: apache/kafka:latest
    container_name: cgv-kafka-3
    ports:
      - "9096:9096"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:19092,EXTERNAL://0.0.0.0:9096,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://cgv-kafka-3:19092,EXTERNAL://localhost:9096'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@cgv-kafka-1:9093,2@cgv-kafka-2:9093,3@cgv-kafka-3:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_KRAFT_CLUSTER_ID: "AbCdEfGhIjKlMnOpQrStUv"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    networks:
      - cgv-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cgv-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: 3-broker-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: cgv-kafka-1:19092,cgv-kafka-2:19092,cgv-kafka-3:19092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - cgv-net
    restart: unless-stopped