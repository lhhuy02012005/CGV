version: '3.8'

# ==============================================================================
# HỆ THỐNG CGV CINEMAS - DOCKER COMPOSE PRODUCTION (AWS FREE TIER OPTIMIZED)
# ==============================================================================
# Cấu hình tối ưu hóa tài nguyên cho gói Free Tier (EC2 t2.micro / t3.micro):
# - Ép RAM JVM bằng SerialGC: -Xms128m -Xmx220m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m
# - Tích hợp Kafka Cluster (2 Broker KRaft siêu nhẹ, bỏ hoàn toàn Zookeeper)
# - Kết nối trực tiếp AWS RDS PostgreSQL & ElastiCache Redis Free Tier
# - Kong API Gateway chạy chế độ DB-less (0MB Database overhead)
# ==============================================================================

networks:
  cgv-prod-net:
    driver: bridge

volumes:
  kafka_1_data:
  kafka_2_data:

services:
  # ============================================================================
  # LAYER 1: API GATEWAY (KONG DB-LESS)
  # ============================================================================
  kong:
    image: kong:3.6
    container_name: cgv-kong-prod
    restart: always
    user: "0:0"
    ports:
      - "8000:8000" # Cổng nhận traffic từ Internet / Frontend
      - "8001:8001" # Cổng quản trị Admin nội bộ
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong-prod.yml
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_ADMIN_ACCESS_LOG: "off"
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ./apigateway/kong-prod.yml:/usr/local/kong/declarative/kong-prod.yml:ro
    networks:
      - cgv-prod-net

  # ============================================================================
  # LAYER 2: KAFKA CLUSTER (KRAFT MODE - 2 BROKERS SIÊU TIẾT KIỆM RAM)
  # ============================================================================
  kafka-broker-1:
    image: bashj79/kafka-kraft:latest
    container_name: cgv-kafka-broker-1
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-1:9093,2@kafka-broker-2:9095"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_ADVERTISED_HOST_1:-kafka-broker-1}:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_HEAP_OPTS: "-Xmx180m -Xms90m"
    volumes:
      - kafka_1_data:/tmp/kraft-combined-logs
    networks:
      - cgv-prod-net

  kafka-broker-2:
    image: bashj79/kafka-kraft:latest
    container_name: cgv-kafka-broker-2
    restart: always
    ports:
      - "9094:9094"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-1:9093,2@kafka-broker-2:9095"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://0.0.0.0:9094,CONTROLLER://0.0.0.0:9095"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_ADVERTISED_HOST_2:-kafka-broker-2}:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_HEAP_OPTS: "-Xmx180m -Xms90m"
    volumes:
      - kafka_2_data:/tmp/kraft-combined-logs
    networks:
      - cgv-prod-net

  # ============================================================================
  # LAYER 3: CORE MICROSERVICES (SPRING BOOT 3 / JAVA 21)
  # ============================================================================
  # 1. Identity Service (Auth, User, Role, Membership)
  identity-service:
    build:
      context: ./identityservice
      dockerfile: Dockerfile
    image: cgv/identity-service:prod
    container_name: cgv-identity-prod
    restart: always
    ports:
      - "8081:8081"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx200m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ENDPOINT:-postgres}:5432/cgv
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CgvFreeTier2026!}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:9092,kafka-broker-2:9094}
    networks:
      - cgv-prod-net

  # 2. Catalog Service (Phim, Cụm rạp, Phòng chiếu, Lịch chiếu, gRPC Server 9090)
  catalog-service:
    build:
      context: ./catalogservice
      dockerfile: Dockerfile
    image: cgv/catalog-service:prod
    container_name: cgv-catalog-prod
    restart: always
    ports:
      - "8083:8083"
      - "9090:9090" # Cổng gRPC Server
    environment:
      JAVA_OPTS: "-Xms128m -Xmx220m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ENDPOINT:-postgres}:5432/cgv
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CgvFreeTier2026!}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:9092,kafka-broker-2:9094}
      GRPC_SERVER_PORT: 9090
    networks:
      - cgv-prod-net

  # 3. Booking Service (Đặt vé, Khóa ghế, Soát vé QR, gRPC Client gọi Catalog)
  booking-service:
    build:
      context: ./bookingservice
      dockerfile: Dockerfile
    image: cgv/booking-service:prod
    container_name: cgv-booking-prod
    restart: always
    ports:
      - "8082:8082"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx240m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ENDPOINT:-postgres}:5432/cgv
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CgvFreeTier2026!}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:9092,kafka-broker-2:9094}
      CATALOG_GRPC_HOST: ${CATALOG_GRPC_HOST:-catalog-service}
      CATALOG_GRPC_PORT: 9090
    depends_on:
      - catalog-service
    networks:
      - cgv-prod-net

  # 4. Payment Service (Cổng VNPay, MoMo, Idempotency Webhook)
  payment-service:
    build:
      context: ./paymentservice
      dockerfile: Dockerfile
    image: cgv/payment-service:prod
    container_name: cgv-payment-prod
    restart: always
    ports:
      - "8085:8085"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx200m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ENDPOINT:-postgres}:5432/cgv
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CgvFreeTier2026!}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:9092,kafka-broker-2:9094}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:5173/payment-result}
    networks:
      - cgv-prod-net

  # 5. Marketing Service (Voucher, Khuyến mãi)
  marketing-service:
    build:
      context: ./marketingservice
      dockerfile: Dockerfile
    image: cgv/marketing-service:prod
    container_name: cgv-marketing-prod
    restart: always
    ports:
      - "8084:8084"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx190m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ENDPOINT:-postgres}:5432/cgv
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CgvFreeTier2026!}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:9092,kafka-broker-2:9094}
    networks:
      - cgv-prod-net
