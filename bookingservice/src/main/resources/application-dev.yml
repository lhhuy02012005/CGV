server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: booking-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cgv}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      # maximum-pool-size=10: tối đa 10 connection đến DB
      # → đủ cho concurrency=3 consumer + HTTP handlers, không overload DB
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      # idle-timeout=600000: connection idle 10 phút → đóng để giải phóng tài nguyên DB
      idle-timeout: 600000
      # max-lifetime=1800000: mỗi connection sống tối đa 30 phút rồi tạo mới
      # → tránh "stale connection" bị firewall/DB server đóng ngầm
      max-lifetime: 1800000

  flyway:
    enabled: false
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # acks=all: payment là business-critical nhất
        # → không được mất payment.completed event dù bất kỳ lý do gì
        acks: all
        retries: 3
        retry.backoff.ms: 1000
        # idempotence: chống duplicate payment event khi retry
        # → tránh scenario: thanh toán thành công 1 lần nhưng event bị gửi 2 lần
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        batch.size: 16384
        linger.ms: 5
        compression.type: snappy
        buffer.memory: 33554432
        request.timeout.ms: 30000
        delivery.timeout.ms: 120000
        # transaction.id.prefix=payment-tx-: Payment transaction là critical nhất
        # → "cập nhật trạng thái payment + publish payment.completed event" là atomic
        # → booking service chỉ confirm booking khi payment event thực sự committed
        transaction.id.prefix: ${KAFKA_TRANSACTION_ID_PREFIX:payment-tx-}

    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
      group-id: ${KAFKA_CONSUMER_GROUP_ID:booking-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.cgv.commondto.event,com.cgv.*"
        # 50 records/poll: payment cần xử lý cẩn thận từng record
        # → batch nhỏ hơn để kiểm soát chặt, tránh xử lý quá nhiều payment cùng lúc
        max.poll.records: 50
        # 600s: payment có thể call VNPay/Momo/VNPT API
        # → tăng interval để tránh rebalance khi đang chờ external payment gateway
        max.poll.interval.ms: 600000
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
        # read_committed: chỉ xử lý booking event đã commit hoàn toàn
        # → không khởi tạo thanh toán cho booking đang bị rollback
        isolation.level: read_committed

    listener:
      concurrency: 3
      ack-mode: MANUAL_IMMEDIATE
      poll-timeout: 3000
      missing-topics-fatal: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${REALM:cgv-realm}/protocol/openid-connect/certs

logging:
  level:
    com.cgv.bookingservice: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN

grpc:
  client:
    catalog-service:
      address: ${GRPC_CLIENT_CATALOG_SERVICE_ADDRESS:static://${CATALOG_GRPC_HOST:127.0.0.1}:${CATALOG_GRPC_PORT:9090}} # CatalogService gRPC server
      negotiation-type: plaintext
    marketing-service:
      address: ${GRPC_CLIENT_MARKETING_SERVICE_ADDRESS:static://${MARKETING_GRPC_HOST:127.0.0.1}:${MARKETING_GRPC_PORT:9099}}
      negotiation-type: plaintext

booking:
  seat-lock:
    cooldown-enabled: ${SEAT_LOCK_COOLDOWN_ENABLED:false} # Bật/tắt tính năng phạt khóa giữ ghế 15 phút (mặc định: false)

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

