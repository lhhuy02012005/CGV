_format_version: "3.0"
_transform: true

# ==============================================================================
# CGV PRODUCTION KONG API GATEWAY CONFIGURATION (DB-less Mode)
# ==============================================================================
# HƯỚNG DẪN CẤU HÌNH HOST BACKEND:
# - Trường hợp 1: Chạy 2 máy ảo EC2 Free Tier (Khuyên dùng):
#   Thay `10.0.1.20` bằng Private IPv4 của Máy ảo 2 (cgv-ec2-services).
# - Trường hợp 2: Chạy All-in-One trên 1 máy ảo EC2 duy nhất (Bridge network cgv-net):
#   Thay `http://10.0.1.20:xxxx` thành `http://<service-name>:xxxx` (VD: `http://booking-service:8082`).
# ==============================================================================

services:
  # 1. Identity Service (Auth, User, Role, Membership)
  - name: identity-service
    url: http://10.0.1.20:8081
    routes:
      - name: identity-route
        paths:
          - /api/v1/auth
          - /api/v1/users
          - /api/v1/roles
          - /api/v1/membership-tiers
          - /api/v1/swagger-ui
          - /api/v1/swagger-ui.html
          - /api/v1/v3/api-docs
        strip_path: false
      - name: identity-register-init-route
        paths:
          - /api/v1/auth/register/init
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
              fault_tolerant: true

  # 2. Booking Service (Đặt vé, Giữ ghế, Soát vé QR, SSE Realtime)
  - name: booking-service
    url: http://10.0.1.20:8082
    routes:
      - name: booking-route
        paths:
          - /api/v1/bookings
          - /api/v1/ws
        strip_path: false

  # 3. Catalog Service (Phim, Cụm rạp, Phòng chiếu, Lịch chiếu, Ghế, SSE Realtime)
  - name: catalog-service
    url: http://10.0.1.20:8083/api/v1
    routes:
      - name: catalog-route
        paths:
          - /api/v1/catalogs
        strip_path: true
      - name: catalog-direct-route
        paths:
          - /api/v1/movies
          - /api/v1/cinemas
          - /api/v1/showtimes
          - /api/v1/seats
          - /api/v1/seat-types
          - /api/v1/regions
          - /api/v1/rooms
        strip_path: false

  # 4. Marketing Service (Khuyến mãi, Voucher gRPC/REST)
  - name: marketing-service
    url: http://10.0.1.20:8084
    routes:
      - name: marketing-route
        paths:
          - /api/v1/marketings
        strip_path: false

  # 5. Payment Service (VNPAY, MoMo IPN Webhook)
  - name: payment-service
    url: http://10.0.1.20:8085
    routes:
      - name: payment-route
        paths:
          - /api/v1/payment
          - /api/v1/payments
        strip_path: false

  # 6. Notification Service (SSE, Email, SMS)
  - name: notification-service
    url: http://10.0.1.20:8086
    routes:
      - name: notification-route
        paths:
          - /api/v1/notification
        strip_path: false

  # 7. Media Service (Upload Poster, Video, Assets S3)
  - name: media-service
    url: http://10.0.1.20:8087
    routes:
      - name: media-route
        paths:
          - /api/v1/media
        strip_path: false

plugins:
  # CORS toàn diện cho Production (Hỗ trợ CloudFront, Vercel, S3 Static Web, và Domain/IP Public)
  - name: cors
    config:
      origins:
        - ".*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      headers:
        - "*"
      exposed_headers:
        - Authorization
        - X-Device-List-Outdated
        - Set-Cookie
        - Content-Type
        - Content-Length
        - Cache-Control
      credentials: true
      max_age: 3600
