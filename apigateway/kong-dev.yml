_format_version: "3.0"
_transform: true

services:
  - name: identity-service
    url: http://identity-service:8081
    routes:
      - name: identity-route
        paths:
          - /api/v1/auth
          - /api/v1/users
          - /api/v1/roles
          - /api/v1/swagger-ui
          - /api/v1/swagger-ui.html
          - /api/v1/v3/api-docs
        strip_path: false
      - name: identity-register-init-route
        paths:
          - /api/v1/auth/register/init
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5          # Giới hạn tối đa 5 request mỗi phút cho API này
              policy: local
              fault_tolerant: true

  - name: booking-service
    url: http://host.docker.internal:8082
    routes:
      - name: booking-route
        paths:
          - /api/v1/bookings
        strip_path: false

  - name: catalog-service
    url: http://host.docker.internal:8083
    routes:
      - name: catalog-route
        paths:
          - /api/v1/catalogs
        strip_path: false

  - name: marketing-service
    url: http://host.docker.internal:8084
    routes:
      - name: marketing-route
        paths:
            - /api/v1/marketings
        strip_path: false

  - name: payment-service
    url: http://host.docker.internal:8085
    routes:
      - name: payment-route
        paths:
          - /api/v1/payment
        strip_path: false

#  - name: notification-service
#    url: http://notification-service:8086
#    routes:
#      - name: notification-route
#        paths:
#          - /api/v1/notification
#        strip_path: false

  - name: media-service
    url: http://host.docker.internal:8087
    routes:
      - name: media-route
        paths:
          - /api/v1/media
        strip_path: false

plugins:
  # 1. CORS Configuration
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
        - http://localhost:5174
        - http://localhost:8000
        - http://localhost:8081
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      headers:
        - "*"
      exposed_headers:
        - Authorization
        - X-Device-List-Outdated
        - Set-Cookie
      credentials: true
      max_age: 3600