apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: cgv-prod
  labels:
    app: identity-service
spec:
  replicas: 2 # Tăng lên 2 Pods để đảm bảo tính sẵn sàng cao cho xác thực người dùng
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
      containers:
        - name: identity-service
          image: 313078327818.dkr.ecr.ap-southeast-1.amazonaws.com/cgv/identity-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: identity-service-group
          envFrom:
            - configMapRef:
                name: cgv-global-config
            - secretRef:
                name: cgv-global-secrets
          resources:
            requests:
              cpu: "300m"
              memory: "350Mi"
            limits:
              cpu: "1000m"
              memory: "750Mi"
          startupProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
