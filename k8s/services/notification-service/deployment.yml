apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cgv-prod
  labels:
    app: notification-service
spec:
  replicas: 2 # Mặc định 2 Pods để gửi Email/OTP kịp thời, không bị dồn ứ Kafka consumer
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: cgv/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          envFrom:
            - configMapRef:
                name: cgv-global-config
            - secretRef:
                name: cgv-global-secrets
          resources:
            requests:
              cpu: "80m"
              memory: "150Mi"
            limits:
              cpu: "400m"
              memory: "300Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: 8086
            initialDelaySeconds: 40
            periodSeconds: 15
