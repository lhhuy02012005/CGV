apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: cgv-prod
  labels:
    app: media-service
spec:
  replicas: 1 # Chạy 1 Pod (Chỉ phục vụ upload ảnh/video banner S3)
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
      containers:
        - name: media-service
          image: 313078327818.dkr.ecr.ap-southeast-1.amazonaws.com/cgv/media-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
          envFrom:
            - configMapRef:
                name: cgv-global-config
            - secretRef:
                name: cgv-global-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "250Mi"
            limits:
              cpu: "1000m"
              memory: "750Mi"
          startupProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 15
