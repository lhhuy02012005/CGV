apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: cgv-prod
  labels:
    app: booking-service
spec:
  replicas: 2 # Chạy mặc định 2 Pods để chịu tải thời gian thực (giữ ghế Redis, Kafka)
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: cgv/booking-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: cgv-global-config
            - secretRef:
                name: cgv-global-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "200Mi"
            limits:
              cpu: "600m"
              memory: "400Mi" # Cấp 400Mi để duy trì WebSocket và Distributed Lock an toàn
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: 8082
            initialDelaySeconds: 50
            periodSeconds: 15
