apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-service
  namespace: cgv-prod
  labels:
    app: marketing-service
spec:
  replicas: 1 # Chạy 1 Pod
  selector:
    matchLabels:
      app: marketing-service
  template:
    metadata:
      labels:
        app: marketing-service
    spec:
      containers:
        - name: marketing-service
          image: 313078327818.dkr.ecr.ap-southeast-1.amazonaws.com/cgv/marketing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
            - name: grpc
              containerPort: 9099
          env:
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: marketing-service-group
          envFrom:
            - configMapRef:
                name: cgv-global-config
            - secretRef:
                name: cgv-global-secrets
          resources:
            requests:
              cpu: "300m"
              memory: "350Mi"
            limits:
              cpu: "1000m"
              memory: "750Mi"
          startupProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
