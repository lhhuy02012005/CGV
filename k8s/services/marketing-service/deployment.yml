apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-service
  namespace: cgv-prod
  labels:
    app: marketing-service
spec:
  replicas: 1 # Chạy 1 Pod
  selector:
    matchLabels:
      app: marketing-service
  template:
    metadata:
      labels:
        app: marketing-service
    spec:
      containers:
        - name: marketing-service
          image: cgv/marketing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
            - name: grpc
              containerPort: 9099
          envFrom:
            - configMapRef:
                name: cgv-global-config
            - secretRef:
                name: cgv-global-secrets
          resources:
            requests:
              cpu: "80m"
              memory: "150Mi"
            limits:
              cpu: "400m"
              memory: "300Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 15
