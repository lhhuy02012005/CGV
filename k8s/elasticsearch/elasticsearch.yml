apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: cgv-prod
  labels:
    app: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
          ports:
            - name: http
              containerPort: 9200
          resources:
            requests:
              cpu: "100m"
              memory: "400Mi"
            limits:
              cpu: "1000m"
              memory: "1000Mi"
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 70
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 120
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: cgv-prod
  labels:
    app: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
